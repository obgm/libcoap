name: CIFuzz

on:
  push:
    branches:
      - main
      - develop
      - release-*
      - gh-workflows

jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer:
          - address
          - undefined
        architecture:
          - x86_64
        include:
          - sanitizer: address
            architecture: i386
    steps:
    - name: Build Fuzzers
      id: build
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
      with:
        oss-fuzz-project-name: 'libcoap'
        dry-run: false
        sanitizer: ${{ matrix.sanitizer }}
        architecture: ${{ matrix.architecture }}
        language: c
    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
      with:
        oss-fuzz-project-name: 'libcoap'
        fuzz-seconds: 300
        sanitizer: ${{ matrix.sanitizer }}
        dry-run: false
        language: c
    - name: Upload Crash
      uses: actions/upload-artifact@v4
      if: failure() && steps.build.outcome == 'success'
      with:
        name: ${{ matrix.sanitizer }}-${{ matrix.architecture }}-artifacts
        path: ./out/artifacts
